name: physics

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Physics locks
        run: python3 -m unittest discover -s tests -v
